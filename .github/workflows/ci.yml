name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend unit + integration (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile + unit tests + integration tests
        run: mvn -B -f backend/pom.xml test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: E2E (Playwright, full compose stack)
    runs-on: ubuntu-latest
    # Dev-only credentials for the throwaway local Postgres/Keycloak. For any non-local
    # deployment, replace the || fallbacks with required secrets (drop the defaults).
    env:
      DB_USERNAME: ${{ secrets.DB_USERNAME || 'claims' }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'claims' }}
      KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD || 'admin' }}
      ADJUSTER_PASSWORD: ${{ secrets.ADJUSTER_PASSWORD || 'adjuster-Pass-123' }}
      SUPERVISOR_PASSWORD: ${{ secrets.SUPERVISOR_PASSWORD || 'supervisor-Pass-123' }}
      CLAIMANT_PASSWORD: ${{ secrets.CLAIMANT_PASSWORD || 'claims-Pass-123' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Render Keycloak realm (inject provisioned-user passwords)
        run: node keycloak/render-realm.mjs
      - name: Start stack (Postgres + Mailpit + Keycloak)
        run: docker compose up -d db mailpit keycloak
      - name: Wait for Keycloak realm
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:8090/realms/claims/.well-known/openid-configuration) && [ "$code" = "200" ] \
              && { echo "Keycloak realm ready"; exit 0; }
            sleep 5
          done
          echo "Keycloak did not become ready" >&2
          exit 1
      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test
