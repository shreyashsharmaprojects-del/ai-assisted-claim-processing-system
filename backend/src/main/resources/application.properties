spring.application.name=claims-backend

server.port=8081

# Dev database. Canonical setup: `docker compose up -d` (Postgres 16, port 5432). Flyway
# migrates on boot. Credentials come from the environment (see .env.example -> .env): DB_USERNAME,
# DB_PASSWORD. They are never committed; run the backend with those exported (the root
# `npm run backend` script sources .env for you). The URL is overridable via SPRING_DATASOURCE_URL.
spring.datasource.url=jdbc:postgresql://localhost:5432/claims
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
# No view rendering happens inside the request; keep sessions short.
spring.jpa.open-in-view=false

# Keycloak (docker compose): realm "claims", public SPA client, claimant self-registration.
# The backend is an OIDC resource server validating access tokens from this issuer.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8090/realms/claims

# FNOL email. Dev SMTP is Mailpit (docker compose): localhost:1025, web UI :8025.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
claims.mail.from=no-reply@claims.test

# Claimant evidence photos: files on disk, path in DB (see docs/decisions.md).
claims.uploads.dir=./uploads
claims.uploads.max-size-bytes=10485760
claims.uploads.max-count=5

# S2 storage backend: filesystem (default, local dev) or s3 (S3-compatible object
# store via zero-dependency HttpClient + SigV4 in S3PhotoStorage). S3 credentials
# are env-injected (CLAIMS_S3_*), never committed — see .env.example.
claims.storage.backend=filesystem
claims.storage.backfill=false
claims.s3.endpoint=${CLAIMS_S3_ENDPOINT:http://localhost:9000}
claims.s3.bucket=${CLAIMS_S3_BUCKET:claims-evidence}
claims.s3.region=${CLAIMS_S3_REGION:us-east-1}
claims.s3.access-key=${CLAIMS_S3_ACCESS_KEY:}
claims.s3.secret-key=${CLAIMS_S3_SECRET_KEY:}

# Multipart request limits. These sit ABOVE the app-level caps (claims.uploads.*) so the
# app returns a readable per-file/count validation message instead of the multipart layer
# short-circuiting to a generic 500.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=60MB

# Aging job (Flow 6): claims undecided 3 days from FNOL are pushed to L2, 5 days to the
# supervisor. Runs daily at 03:00 (AgingScheduler, @EnableScheduling). Claim-writing
# integration tests switch it off (claims.aging.enabled=false) via the inherited
# @DynamicPropertySource on ClaimTableResettingTest and drive
# AgingService.ageClaims(Instant) with fixed instants instead — a cron firing mid-suite
# could never be deterministic. Do NOT reintroduce src/test/resources/application.properties:
# it shadows the main properties file wholesale and breaks property resolution.
claims.aging.enabled=true

# FNOL flood protection: at most this many filings per claimant per rolling 24h (429
# beyond that). Generous — real claimants file once; a burst is abuse or a stuck retry
# loop. See docs/decisions.md (production hardening entry).
claims.fnol.rate-limit-per-day=20

# R2 email outbox dispatcher: every 60s it delivers due PENDING rows (batch 50),
# exponential backoff 1m→4h, parks rows FAILED after 8 attempts. Claim-writing
# integration tests switch it off (claims.outbox.enabled=false) via the inherited
# @DynamicPropertySource on ClaimTableResettingTest and drive
# EmailOutboxDispatcher.dispatch() directly instead — a scheduler firing mid-suite
# could never be deterministic. Controllers flush the dispatcher after commit, so normal
# operation still delivers promptly with the scheduler off.
claims.outbox.enabled=true
claims.outbox.interval-ms=60000
claims.outbox.max-attempts=8
claims.outbox.batch=50

# R3 metrics: dependency-free JSON scrape at GET /api/metrics (supervisor-scoped in
# SecurityConfig). Actuator exposes nothing (no scrape surface beyond /api/metrics).

# V24 (V3 S9): the retention policy window — closed claims older than this many
# years are candidates for review. Advisory only: the retention-report endpoint
# reports fixed 6/7/10-year buckets (report-only, no auto-delete); this key
# documents the policy value the middle bucket mirrors.
claims.retention.closed-years=7

# V25 (V3 S10): the SMS seam — no provider is wired this slice (NoopSmsSender
# logs and records nothing), so this stays false. Flip to true only with a real
# SmsSender adapter; nothing else reads it yet.
claims.sms.enabled=false

# Request logs carry the request id (%X{rid}): "grep rid=a1b2c3d4 app.log" finds the exact
# request behind a user's error Reference. The id is echoed on X-Request-Id responses.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{rid:-none}] %logger{36} : %msg%n
