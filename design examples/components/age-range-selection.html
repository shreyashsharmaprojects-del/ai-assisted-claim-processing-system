<style>
    .age-range-container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .age-card {
        background: #fcfdfe;
        border: 1px solid #f0f2f5;
        border-radius: 12px;
        padding: 16px;
    }
    .age-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px;
        background: #fff;
        border: 1px solid #eee;
        border-radius: 8px;
        margin-bottom: 16px;
    }
    .age-label { font-size: 14px; font-weight: 500; }
    .age-title { font-size: 13px; font-weight: 600; margin-bottom: 12px; color: #666; }
    .range-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .range-label { font-size: 13px; font-weight: 700; color: #003399; width: 35px; }
    .range-inputs { display: flex; align-items: center; gap: 8px; flex: 1; }
    .input-pair {
        display: flex;
        align-items: center;
        border: 1px solid #e0e6ed;
        border-radius: 6px;
        padding: 4px 8px;
        background: #fff;
        flex: 1;
    }
    .input-pair input { border: none; width: 30px; outline: none; font-size: 13px; text-align: center; }
    .unit-label { font-size: 11px; color: #666; margin-left: auto; }
    .dash { font-weight: bold; color: #0056b3; }
    .age-dropdown {
        margin-left: auto;
        border: 1px solid #e0e6ed;
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 12px;
        color: #666;
        display: flex;
        align-items: center;
        gap: 8px;
    }
</style>
<div class="age-range-container">
    <!-- Reusable logic for Age Card -->
    <div class="age-card">
        <div class="age-header"><input type="checkbox" checked><span class="age-label">Self</span></div>
        <div class="age-title">Select Age Range</div>
        <div class="range-row">
            <div class="range-label">NB</div>
            <div class="range-inputs">
                <div class="input-pair"><input type="text" placeholder="YY"><span class="unit-label">Year</span></div>
                <span class="dash">-</span>
                <div class="input-pair"><input type="text" placeholder="YY"><span class="unit-label">Year</span></div>
            </div>
        </div>
        <div class="range-row">
            <div class="range-label">RNW</div>
            <div class="range-inputs">
                <div class="input-pair"><input type="text" placeholder="YY"><span class="unit-label">Year</span></div>
                <span class="dash">-</span>
                <div class="input-pair"><input type="text" placeholder="YY"><span class="unit-label">Year</span></div>
            </div>
        </div>
    </div>
    <!-- Spouse Card -->
    <div class="age-card">
        <div class="age-header"><input type="checkbox"><span class="age-label">Spouse</span></div>
        <div class="age-title">Select Age Range</div>
        <div class="range-row">
            <div class="range-label">NB</div>
            <div class="range-inputs">
                <div class="input-pair"><input type="text" placeholder="YY"><span class="unit-label">Year</span></div>
                <span class="dash">-</span>
                <div class="input-pair"><input type="text" placeholder="YY"><span class="unit-label">Year</span></div>
            </div>
        </div>
    </div>
    <!-- Children Card -->
    <div class="age-card">
        <div class="age-header">
            <input type="checkbox"><span class="age-label">Children</span>
            <div class="age-dropdown">No. of Children <i class="fas fa-chevron-down"></i></div>
        </div>
        <div class="age-title">Select Age Range</div>
        <div class="range-row">
            <div class="range-label">NB</div>
            <div class="range-inputs">
                <div class="input-pair"><input type="text" placeholder="MM"><span class="unit-label">M Y</span></div>
                <span class="dash">-</span>
                <div class="input-pair"><input type="text" placeholder="YY"><span class="unit-label">M Y</span></div>
            </div>
        </div>
    </div>
</div>
