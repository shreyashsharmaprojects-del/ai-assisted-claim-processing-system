<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
<style>
    :root {
        --text-main: #1e293b;
        --border-color: #e2e8f0;
        --text-muted: #64748b;
        --primary-blue: #0056b3;
    }
    .form-section {
        background: white;
        border-radius: 8px;
        padding: 24px;
        border: 1px solid var(--border-color);
        flex: 1;
        font-family: 'Inter', sans-serif;
    }
    .section-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
    }
    .section-icon {
        width: 32px;
        height: 32px;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        color: var(--text-muted);
    }
    .section-header h3 {
        font-size: 18px;
        font-weight: 600;
    }
    .form-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
        align-items: start;
    }
    .form-group label {
        display: block;
        font-size: 13px;
        margin-bottom: 8px;
        color: #64748b;
        font-weight: 500;
    }
    .input-control {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 14px;
        color: #1e293b;
        outline: none;
        transition: border-color 0.2s;
    }
    .input-control:focus {
        border-color: #85b1e6;
    }
    .input-control::placeholder {
        color: #94a3b8;
    }
    .tenure-tabs {
        display: flex;
        gap: 8px;
    }
    .tenure-tab {
        flex: 1;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        color: #94a3b8;
        background: white;
        transition: all 0.2s;
    }
    .tenure-tab.active {
        color: var(--text-main);
        border-color: #85b1e6;
    }
    .radio-circle {
        width: 18px;
        height: 18px;
        border: 1px solid #cbd5e1;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .tenure-tab.active .radio-circle {
        background: var(--primary-blue);
        border-color: var(--primary-blue);
    }
    .radio-checked {
        color: white;
        font-size: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .helper-text {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 8px;
    }
</style>
<div class="form-section">
    <div class="section-header">
        <i
            class="fas fa-layer-group section-icon"
            style="border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px"
        ></i>
        <h3 style="font-size: 18px; font-weight: 700; color: #1e293b; margin-left: 8px">Plan Details</h3>
    </div>

    <div class="form-grid">
        <div class="form-group">
            <label>Plan Name</label>
            <input type="text" class="input-control" placeholder="Enter Plan Name" />
        </div>

        <div class="form-group">
            <label>Tenure Type (Number of..)</label>
            <div class="tenure-tabs">
                <div class="tenure-tab active">
                    Days
                    <span class="radio-circle radio-checked"><i class="fas fa-check"></i></span>
                </div>
                <div class="tenure-tab">
                    Months
                    <span class="radio-circle"></span>
                </div>
                <div class="tenure-tab">
                    Years
                    <span class="radio-circle"></span>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>Tenure Value</label>
            <input type="text" class="input-control" placeholder="Enter Tenure Value" />
            <div class="helper-text">Enter values between 1 and 20</div>
        </div>
    </div>
</div>
<script>
    document.querySelectorAll('.tenure-tabs').forEach((group) => {
        const options = group.querySelectorAll('.tenure-tab');
        options.forEach((option) => {
            option.addEventListener('click', () => {
                options.forEach((opt) => {
                    opt.classList.remove('active');
                    opt.querySelector('.radio-circle').innerHTML = '';
                    opt.querySelector('.radio-circle').classList.remove('radio-checked');
                });
                option.classList.add('active');
                const circle = option.querySelector('.radio-circle');
                circle.classList.add('radio-checked');
                circle.innerHTML = '<i class="fas fa-check"></i>';
            });
        });
    });
</script>
