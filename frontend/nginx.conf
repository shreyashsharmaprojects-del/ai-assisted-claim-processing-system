# Public SPA + API gateway. Serves the Angular bundle, proxies /api to the backend,
# and keeps every response cache-safe: immutable hashed assets cache for a year, while
# index.html and the runtime config are never cached (a deploy must reach users now).
# R6 IP-level flood protection on multipart FNOL: 5 req/s sustained per client IP
# with a burst of 10 (excess bursts are delayed, not rejected). Per-claimant 20/day
# (app layer) stops one account; this stops a botnet of throwaway claimants. App-layer
# per-IP accounting is the WAF's job if this ever needs to be smarter.
# NOTE: http-context (this file is included from nginx http{}): limit_req_zone cannot
# live inside server{}.
limit_req_zone $binary_remote_addr zone=fnol:10m rate=5r/s;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /assets/config.json {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location = /api/claims {
    limit_req zone=fnol burst=10 nodelay;
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }
}
