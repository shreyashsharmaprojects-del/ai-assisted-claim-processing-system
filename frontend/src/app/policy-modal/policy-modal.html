<!-- Whole policy page in a modal. Fetching, open state, and focus discipline
     stay with the parent; Esc/scrim/Close emit `closed`. -->
<div class="policy-modal" data-testid="detail-policy-modal" id="detail-policy-modal">
  <div class="policy-modal__scrim" (click)="close()"></div>
  <div
    class="policy-modal__dialog"
    role="dialog"
    aria-modal="true"
    aria-label="Policy details"
    tabindex="-1"
    (click)="$event.stopPropagation()"
    (keydown.escape)="close()"
  >
    <div class="policy-modal__head">
      <h2>Policy</h2>
      <button
        type="button"
        class="btn btn--tertiary btn--sm"
        data-testid="detail-policy-modal-close"
        (click)="close()"
      >
        Close
      </button>
    </div>
    <div class="policy-modal__body">
      <app-policy-detail [policyNumber]="policyNumber"></app-policy-detail>
    </div>
  </div>
</div>
