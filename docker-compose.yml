services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: claims
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d claims"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.22
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI: http://localhost:8025
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8090:8080"   # host 8080 is taken by an unrelated process; Keycloak lives on 8090
    volumes:
      # Only the rendered realm file is imported (keycloak/render-realm.mjs writes it from
      # the template + .env; the template lives next to it but is not mounted).
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
