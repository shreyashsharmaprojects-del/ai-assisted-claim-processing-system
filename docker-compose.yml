services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: claims
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d claims"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.22
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI: http://localhost:8025
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8090:8080"   # host 8080 is taken by an unrelated process; Keycloak lives on 8090
    volumes:
      # Only the rendered realm file is imported (keycloak/render-realm.mjs writes it from
      # the template + .env; the template lives next to it but is not mounted).
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      db:
        condition: service_healthy

  # S2 dev object storage: S3-compatible MinIO. The backend talks to it when
  # claims.storage.backend=s3 (CLAIMS_S3_ENDPOINT=http://localhost:9000). The
  # bucket is auto-created on first boot by the createbucket job below.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${CLAIMS_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${CLAIMS_S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API (CLAIMS_S3_ENDPOINT)
      - "9001:9001"   # console: http://localhost:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local 2>/dev/null || wget -qO- http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-22T07-53-39Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/$${CLAIMS_S3_BUCKET:-claims-evidence} &&
      echo 'bucket ready'
      "
    environment:
      MINIO_ROOT_USER: ${CLAIMS_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${CLAIMS_S3_SECRET_KEY:-minioadmin}
      CLAIMS_S3_BUCKET: ${CLAIMS_S3_BUCKET:-claims-evidence}

volumes:
  pgdata:
  minio-data:
